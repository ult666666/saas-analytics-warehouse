version: 2

models:
  - name: int_date_spine
    description: One row per day from the first to the last day of data (the reporting calendar).
    columns:
      - name: date_day
        description: Calendar day.
        data_tests: [unique, not_null]

  - name: int_subscription_periods
    description: >
      Paying periods per customer, derived from the event log. A period starts when an event
      takes effect and ends (exclusive) when the customer's next event takes effect. Periods of
      one customer never overlap (see assert_no_overlapping_subscription_periods).
    data_tests:
      - expression_is_true:
          arguments:
            expression: "valid_to is null or valid_to > valid_from"
    columns:
      - name: subscription_period_id
        description: Primary key; the event_id of the event that opened the period.
        data_tests: [unique, not_null]
      - name: customer_id
        description: Customer paying during the period.
        data_tests: [not_null]
      - name: opened_by_event_type
        description: new, upgrade, downgrade or reactivate.
        data_tests:
          - accepted_values:
              arguments:
                values: [new, upgrade, downgrade, reactivate]
      - name: valid_from
        description: First day of the period (inclusive).
        data_tests: [not_null]
      - name: valid_to
        description: Day the next event takes effect (exclusive); null if still running at the end.
      - name: is_open
        description: True when the period is still running on the last day of data.
      - name: plan_price_id
        description: Price billed during the period.
        data_tests: [not_null]
      - name: plan_code
        description: Plan during the period.
      - name: plan_tier
        description: Tier of the plan (1-3).
      - name: billing_interval
        description: month or year.
      - name: seats
        description: Seats during the period.
      - name: mrr_usd
        description: >
          Monthly recurring revenue of the period: seats x unit price, with annual prices divided
          by 12 (see the monthly_amount macro).
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "mrr_usd > 0"

  - name: int_customer_months
    description: >
      Customer x month spine from each customer's first subscription month to the last month
      of data, with no gaps, including months after churn.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, month_start]
    columns:
      - name: customer_id
        description: Customer.
        data_tests: [not_null]
      - name: month_start
        description: First day of the month.
        data_tests: [not_null]
      - name: month_end
        description: Last day of the month; MRR is measured on this day.
        data_tests: [not_null]

  - name: int_signup_funnel
    description: One row per signup with acquisition channel and funnel progress.
    columns:
      - name: signup_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: signed_up_at
        description: Signup timestamp.
      - name: signup_date
        description: Signup date.
      - name: signup_month
        description: First day of the signup month (the funnel cohort).
        data_tests: [not_null]
      - name: utm_source
        description: Cleaned marketing source.
      - name: channel
        description: Acquisition channel from the channel_mapping seed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [paid_search, paid_social, content, partner, organic]
      - name: country_code
        description: Country of the signup.
      - name: company_size
        description: Employee-count band.
      - name: trial_id
        description: Trial started by the signup, if any.
      - name: trial_started_at
        description: Trial start timestamp, if any.
      - name: customer_id
        description: Customer created when the trial converted, if any.
        data_tests: [unique]
      - name: converted_at
        description: Conversion timestamp, if any.
      - name: started_trial
        description: True when the signup started a trial.
      - name: converted_to_paid
        description: True when the signup became a paying customer.

unit_tests:
  - name: subscription_periods_end_when_the_next_event_takes_effect
    description: >
      Each event opens a period that ends when the next event takes effect; cancel events end
      the previous period without opening a new one; annual prices are divided by 12.
    model: int_subscription_periods
    given:
      - input: ref('stg_subscription_events')
        rows:
          - {event_id: e1, customer_id: c1, event_type: new, occurred_at: "2024-01-15 10:00:00", effective_date: "2024-01-15", plan_price_id: growth_monthly_v1, seats: 10}
          - {event_id: e2, customer_id: c1, event_type: upgrade, occurred_at: "2024-02-20 09:00:00", effective_date: "2024-03-15", plan_price_id: growth_monthly_v1, seats: 12}
          - {event_id: e3, customer_id: c1, event_type: cancel, occurred_at: "2024-05-01 08:00:00", effective_date: "2024-06-15", cancel_reason: voluntary}
          - {event_id: e4, customer_id: c2, event_type: new, occurred_at: "2024-02-01 12:00:00", effective_date: "2024-02-01", plan_price_id: growth_annual_v1, seats: 5}
      - input: ref('stg_plans')
        rows:
          - {plan_price_id: growth_monthly_v1, plan_code: growth, plan_tier: 2, billing_interval: month, unit_amount_usd: 29.00}
          - {plan_price_id: growth_annual_v1, plan_code: growth, plan_tier: 2, billing_interval: year, unit_amount_usd: 278.40}
    expect:
      rows:
        - {subscription_period_id: e1, customer_id: c1, valid_from: "2024-01-15", valid_to: "2024-03-15", is_open: false, seats: 10, mrr_usd: 290.00}
        - {subscription_period_id: e2, customer_id: c1, valid_from: "2024-03-15", valid_to: "2024-06-15", is_open: false, seats: 12, mrr_usd: 348.00}
        - {subscription_period_id: e4, customer_id: c2, valid_from: "2024-02-01", valid_to: null, is_open: true, seats: 5, mrr_usd: 116.00}
