[project]
name = "saas-analytics-warehouse"
version = "0.1.0"
description = "Analytics-engineering project for a fictional SaaS company: a seeded data generator, a tested dbt + DuckDB warehouse and a reproducible report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Dai" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    # dbt-duckdb 1.11 was released and tested against DuckDB 1.5; stay on 1.x.
    "duckdb>=1.5,<2",
    "matplotlib>=3.10",
    "numpy>=2.3",
]

[project.urls]
Repository = "https://github.com/ult666666/saas-analytics-warehouse"

[project.scripts]
saasgen = "saasgen.cli:main"
saasreport = "saasreport.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "sqlfluff>=4.4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saasgen", "src/saasreport"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # prefer pathlib
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=saasgen",
    "--cov=saasreport",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
